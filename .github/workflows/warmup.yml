name: EdgeOne 云函数预热

# 为什么需要这个 workflow：
#   线上偶发 500/502 出现在云函数冷启动后的首次请求。
#   EdgeOne Pages 自带的 schedules（edgeone.json）官方限制「cron 最小间隔为一天」，
#   无法做分钟级保活，因此改用 GitHub Actions 定时 ping 预热端点。
#
# 成本核算（永久 $0）：
#   - GitHub Actions 计费按「分钟」向上取整：作业实际只跑 10~20 秒，仍计 1 分钟/次。
#   - 本仓库已转为 Public → 标准 runner 对公开仓库完全免费且不限量，
#     2,000 分钟/月 的私有仓库额度瓶颈彻底消失。
#   - 保留「每小时一次」而非更频繁，原因有二：
#       a) 60 分钟的保活频率对冷启动体验无差别（实测冷启动 978ms / 热实例 712ms，
#          平台实例回收窗口远小于 1 小时）；
#       b) 万一将来仓库转回 Private，1 次/小时 = 720 次/月 ≈ 720 分钟/月，
#          仍在 2,000 分钟免费额度内（36%），留足余量，不会因超限导致预热静默失效。
#   - EdgeOne 免费版 Cloud Functions：每月 1,000,000 次请求。
#     720 次预热 + 约 10,000 次真实业务 ≈ 10,720 次/月 ≈ 1.07%，可忽略。
#   - 硬保险：仓库若曾绑定付款方式，请在 Settings → Billing and licensing → Usage limits
#     将 Budget 设为 $0 并勾选 "Stop usage when budget limit is reached"，
#     确保任何情况下都不会产生费用（详见 README「零成本保障」章节）。
#
# 如需更激进的保活（如每 5 分钟）：
#   仅在仓库为 Public 时才安全（Actions 免费不限量）；Private 状态下请先核算额度。

on:
  schedule:
    # 每小时第 7 分触发一次（避开整点，避开流量高峰的调度延迟）
    - cron: '7 * * * *'
  workflow_dispatch: # 允许手动立即触发一次

concurrency:
  group: edgeone-warmup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warmup:
    name: 预热云函数实例
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 预热
        env:
          # 目标站点；如换域名，改这里即可
          WARMUP_URL: https://bj.5166966.xyz/api/cron/warmup
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/warmup.out -w '%{http_code}' --max-time 25 "$WARMUP_URL" || echo 000)
          body=$(head -c 200 /tmp/warmup.out 2>/dev/null || true)
          echo "HTTP $code  $body"
          if [ "$code" != "200" ]; then
            echo "::warning::预热请求返回 $code（实例可能已被回收或接口异常）"
            exit 0   # 预热失败不阻塞流水线
          fi
